
<!DOCTYPE html>
<html>
<head>
    <title>Cancer Prediction AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 500px; margin-top: 50px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-predict { background-color: #e91e63; color: white; border: none; width: 100%; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Breast Cancer Predictor</h2>
        <form action="/predict" method="post">
            <div class="mb-3"><input type="number" step="0.01" name="f1" class="form-control" placeholder="Mean Radius" required></div>
            <div class="mb-3"><input type="number" step="0.01" name="f2" class="form-control" placeholder="Mean Texture" required></div>
            <div class="mb-3"><input type="number" step="0.01" name="f3" class="form-control" placeholder="Mean Perimeter" required></div>
            <div class="mb-3"><input type="number" step="0.01" name="f4" class="form-control" placeholder="Mean Area" required></div>
            <div class="mb-3"><input type="number" step="0.01" name="f5" class="form-control" placeholder="Mean Smoothness" required></div>
            <button type="submit" class="btn btn-predict">Run AI Diagnosis</button>
        </form>
        {% if prediction_text %}
            <div class="mt-4 alert alert-info text-center"><strong>{{ prediction_text }}</strong></div>
        {% endif %}
    </div>
</body>
</html>
